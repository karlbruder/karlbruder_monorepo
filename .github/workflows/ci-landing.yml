name: CI - Landing Page

on:
  pull_request:
    branches:
      - master
    paths:
      - 'landing/**'
      - '.github/workflows/ci-landing.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build development image
        run: docker build -f landing/Dockerfile --target development -t kb-landing-ci landing

      - name: Run tests
        run: docker run --rm -e CI=true kb-landing-ci npm test -- --watchAll=false

      - name: Build production image
        run: >
          docker build -f landing/Dockerfile --target production
          --build-arg REACT_APP_APPLICATION_URL=https://app.example.test
          landing
