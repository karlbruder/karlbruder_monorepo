name: Deploy - Application

on:
  push:
    branches:
      - master
    paths:
      - "backend/**"
      - "frontend/**"
      - "landing/**"
      - "nginx/**"
      - "compose.prod.yml"
      - ".github/workflows/deploy-application.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        type: choice
        options:
          - dev
          - prod
        default: dev
      service:
        description: Service to build
        required: true
        type: choice
        options:
          - all
          - landing
          - frontend
          - backend
          - nginx
        default: all

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-application-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'prod' }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  AWS_ACCOUNT_ID: "976083331699"
  DEPLOY_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'prod' }}
  APPLICATION_ORIGIN: ${{ (github.event_name == 'workflow_dispatch' && inputs.environment || 'prod') == 'prod' && 'https://app.karlbruder.com' || 'https://app-dev.karlbruder.com' }}
  GITHUB_ACTIONS_ROLE_NAME: KbGithubActionsRole
  DEPLOY_PATH: /opt/karlbruder

jobs:
  changes:
    name: Select changed services
    runs-on: ubuntu-24.04
    outputs:
      services: ${{ github.event_name == 'workflow_dispatch' && (inputs.service == 'all' && '["backend","frontend","landing","nginx"]' || format('["{0}"]', inputs.service)) || steps.filter.outputs.changes }}
    steps:
      - name: Checkout
        if: github.event_name == 'push'
        uses: actions/checkout@v7

      - name: Filter changed paths
        if: github.event_name == 'push'
        id: filter
        uses: dorny/paths-filter@v3
        with:
          base: ${{ github.ref }}
          filters: |
            backend:
              - 'backend/**'
              - 'compose.prod.yml'
              - '.github/workflows/deploy-application.yml'
            frontend:
              - 'frontend/**'
              - 'compose.prod.yml'
              - '.github/workflows/deploy-application.yml'
            landing:
              - 'landing/**'
              - 'compose.prod.yml'
              - '.github/workflows/deploy-application.yml'
            nginx:
              - 'nginx/**'
              - 'compose.prod.yml'
              - '.github/workflows/deploy-application.yml'

  build:
    name: Build and push ${{ matrix.service }}
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'prod' }}
    strategy:
      fail-fast: true
      matrix:
        service: ${{ fromJson(needs.changes.outputs.services) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ env.GITHUB_ACTIONS_ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          file: ${{ matrix.service }}/Dockerfile
          target: production
          push: true
          build-args: ${{ matrix.service == 'landing' && format('REACT_APP_APPLICATION_URL={0}', env.APPLICATION_ORIGIN) || '' }}
          tags: |
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/kb-${{ env.DEPLOY_ENVIRONMENT }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/kb-${{ env.DEPLOY_ENVIRONMENT }}/${{ matrix.service }}:${{ env.DEPLOY_ENVIRONMENT }}
          provenance: false
          sbom: false

  deploy:
    name: Deploy on the application host
    needs: [changes, build]
    if: needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'prod' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ env.GITHUB_ACTIONS_ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy through Session Manager
        env:
          RELEASE_SHA: ${{ github.sha }}
          NAMESPACE: kb-${{ env.DEPLOY_ENVIRONMENT }}
          HOST_NAME_TAG: kb-${{ env.DEPLOY_ENVIRONMENT }}-application-host
          SERVICES: ${{ needs.changes.outputs.services }}
        run: |
          set -euo pipefail

          if [ "${DEPLOY_ENVIRONMENT}" = "prod" ]; then
            export LANDING_SERVER_NAMES="karlbruder.com prod.karlbruder.com"
            export APP_SERVER_NAMES="app.karlbruder.com app-prod.karlbruder.com"
          else
            export LANDING_SERVER_NAMES="dev.karlbruder.com"
            export APP_SERVER_NAMES="app-dev.karlbruder.com"
          fi

          export IMAGE_TAG="${DEPLOY_ENVIRONMENT}"

          instance_id="$(aws ec2 describe-instances \
            --region "${AWS_REGION}" \
            --filters "Name=tag:Name,Values=${HOST_NAME_TAG}" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)"

          if [ -z "${instance_id}" ] || [ "${instance_id}" = "None" ]; then
            echo "::error::No running instance with Name ${HOST_NAME_TAG}."
            exit 1
          fi

          compose_b64="$(base64 -w 0 compose.prod.yml)"
          export instance_id compose_b64

          python3 - <<'PY' > /tmp/ssm-send-command.json
          import json
          import os

          allowed_services = ["backend", "frontend", "landing", "nginx"]
          services = json.loads(os.environ["SERVICES"])
          if not services or any(service not in allowed_services for service in services):
              raise SystemExit(f"Refusing unexpected service list: {services}")

          deploy_path = os.environ["DEPLOY_PATH"]
          aws_region = os.environ["AWS_REGION"]
          aws_account_id = os.environ["AWS_ACCOUNT_ID"]
          namespace = os.environ["NAMESPACE"]
          image_tag = os.environ["IMAGE_TAG"]
          release_sha = os.environ["RELEASE_SHA"]
          landing_server_names = os.environ["LANDING_SERVER_NAMES"]
          app_server_names = os.environ["APP_SERVER_NAMES"]
          registry = f"{aws_account_id}.dkr.ecr.{aws_region}.amazonaws.com"
          compose_b64 = os.environ["compose_b64"]

          commands = [
              "set -eu",
              "command -v docker >/dev/null 2>&1",
              "docker --version",
              "docker compose version",
              f"mkdir -p {deploy_path}",
              f"echo '{compose_b64}' | base64 -d > {deploy_path}/compose.prod.yml",
              f"chown root:docker {deploy_path}/compose.prod.yml",
              f"chmod 664 {deploy_path}/compose.prod.yml",
              f"cd {deploy_path}",
              f"export AWS_ACCOUNT_ID={aws_account_id}",
              f"export AWS_REGION={aws_region}",
              f"export NAMESPACE={namespace}",
              f"export IMAGE_TAG={image_tag}",
              f"export LANDING_SERVER_NAMES='{landing_server_names}'",
              f"export APP_SERVER_NAMES='{app_server_names}'",
              f"aws ecr get-login-password --region {aws_region} | docker login --username AWS --password-stdin {registry}",
          ]

          application_services = [service for service in services if service != "nginx"]
          if application_services:
              joined = " ".join(application_services)
              commands.append(f"docker compose -f compose.prod.yml pull {joined}")
              commands.append(f"docker compose -f compose.prod.yml up -d --no-deps --wait {joined}")

          if "nginx" in services:
              commands.append("docker compose -f compose.prod.yml pull nginx")

          commands.append("docker compose -f compose.prod.yml up -d --no-deps --force-recreate --wait nginx")
          commands.append("docker image prune -f")

          print(json.dumps({
              "DocumentName": "AWS-RunShellScript",
              "InstanceIds": [os.environ["instance_id"]],
              "TimeoutSeconds": 900,
              "Comment": f"karlbruder deploy {release_sha}",
              "Parameters": {"commands": commands},
          }))
          PY

          command_id="$(aws ssm send-command \
            --region "${AWS_REGION}" \
            --cli-input-json file:///tmp/ssm-send-command.json \
            --query 'Command.CommandId' \
            --output text)"

          echo "Session Manager command ${command_id} on ${instance_id}"

          for _ in $(seq 1 90); do
            status="$(aws ssm get-command-invocation \
              --region "${AWS_REGION}" \
              --command-id "${command_id}" \
              --instance-id "${instance_id}" \
              --query 'Status' \
              --output text 2>/dev/null || true)"

            case "${status}" in
              Success)
                aws ssm get-command-invocation \
                  --region "${AWS_REGION}" \
                  --command-id "${command_id}" \
                  --instance-id "${instance_id}" \
                  --query 'StandardOutputContent' \
                  --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                echo "::error::Session Manager command ${status}."
                aws ssm get-command-invocation \
                  --region "${AWS_REGION}" \
                  --command-id "${command_id}" \
                  --instance-id "${instance_id}" \
                  --query 'StandardErrorContent' \
                  --output text
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "::error::Session Manager command ${command_id} did not finish."
          exit 1
