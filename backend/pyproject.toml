[tool.poetry]
name = "karlbruder-backend"
version = "0.1.0"
description = "Karlbruder backend API"
authors = ["Karlbruder Team"]
readme = "README.md"
packages = [
    { include = "app" },
    { include = "config" },
]

[tool.poetry.dependencies]
python = "^3.12"

fastapi = "^0.110"
uvicorn = { extras = ["standard"], version = "^0.27" }
httpx = "^0.27"

# Database
psycopg = "^3.1"
sqlalchemy = { version = "^2.0", extras = ["asyncio"] }
alembic = "^1.13"

# Config
python-dotenv = "^1.0"
pydantic-settings = { version = "^2.2", extras = ["aws-secrets-manager"] }
boto3 = "^1.35"
pandas = "^3.0.0"
psycopg2-binary = "^2.9.11"
pyjwt = { extras = ["crypto"], version = "^2.13.0" }
sentry-sdk = {version = ">=2.0,<3.0", extras = ["fastapi"]}

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
black = "^24.2"
ruff = "^0.3"
mypy = "^1.8"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py", "pf_01_test_backend_postgres_supabase.py"]
markers = [
    "integration: checks a live local or remote service",
    "supabase: checks the real Supabase Postgres project",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
