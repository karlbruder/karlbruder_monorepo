# Isolated application tests. This file publishes no host ports.
# PostgreSQL data is in memory and disappears when the container stops.
# Use a distinct project name whenever another test stack may already be running:
#   docker compose -f compose.test.yml -p kb-test-<name> run --rm backend pytest -x
#   docker compose -f compose.test.yml -p kb-test-<name> down

services:
  db:
    image: postgres:17
    restart: "no"

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres

    tmpfs:
      - /var/lib/postgresql/data:rw,noexec,nosuid,size=512m,uid=999,gid=999

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: test

    restart: "no"

    depends_on:
      db:
        condition: service_healthy

    environment:
      ENV_NAME: test

    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    restart: "no"
    network_mode: none
    environment:
      VITE_SUPABASE_URL: https://test.example.invalid
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_test_not_a_real_key
      VITE_API_BASE_URL: /api
    volumes:
      - ./frontend/src:/app/src:ro
