services:
  db:
    image: postgres:17
    container_name: kb-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development

    container_name: kb-frontend
    restart: unless-stopped

    env_file:
      - ./frontend/.env

    environment:
      API_PROXY_TARGET: http://backend:8000

    depends_on:
      backend:
        condition: service_healthy

    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/supabaseClient.tsx:/app/supabaseClient.tsx
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/vitest.config.ts:/app/vitest.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/tsconfig.app.json:/app/tsconfig.app.json
      - ./frontend/tsconfig.node.json:/app/tsconfig.node.json
      - ./frontend/eslint.config.js:/app/eslint.config.js
      - ./frontend/.env:/app/.env

    ports:
      - "5173:5173"

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:5173/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development

    container_name: kb-backend

    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    env_file:
      - ./backend/.env

    volumes:
      - ./backend:/app

    ports:
      - "8000:8000"

    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8000/api/health/db > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  landing:
    build:
      context: ./landing
      dockerfile: Dockerfile
      target: development

    container_name: kb-landing
    restart: unless-stopped

    env_file:
      - ./landing/.env

    volumes:
      - ./landing/src:/app/src
      - ./landing/public:/app/public
      - ./landing/.env:/app/.env

    ports:
      - "3000:3000"

    stdin_open: true
    tty: true

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  postgres_data:
