AWSTemplateFormatVersion: "2010-09-09"
Description: Local development S3 bucket for Karlbruder

Resources:
  LocalBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: kb-local-bucket
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - http://localhost:5173
            AllowedMethods:
              - PUT
            AllowedHeaders:
              - Content-Type
            MaxAge: 3000
